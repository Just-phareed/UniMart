<!-- Firebase -->

<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";


import { 
getFirestore,
collection,
getDocs
} 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";



const firebaseConfig = {

apiKey: "AIzaSyDLWy48kGrrraPUDi4QljMuWUfXnOYr5Lg",

authDomain: "unimart-34959.firebaseapp.com",

projectId: "unimart-34959",

storageBucket: "unimart-34959.firebasestorage.app",

messagingSenderId: "522549272773",

appId: "1:522549272773:web:b4b8f931c6c64cf2a250ac"

};



const app = initializeApp(firebaseConfig);


const db = getFirestore(app);



const productsBox =
document.getElementById("products");



const snapshot =
await getDocs(collection(db,"products"));



snapshot.forEach((doc)=>{


const item = doc.data();



productsBox.innerHTML += `


<div class="product-card">


<img 
src="${item.image || 'https://via.placeholder.com/250'}"
style="width:100%;border-radius:10px;">



<h3>
${item.name}
</h3>



<p>
₦${item.price}
</p>



<span>
${item.category}
</span>


<br>


<p>
Seller: ${item.seller || "Student"}
</p>



<button onclick="alert('Chat feature coming soon 🔥')">
Contact Seller
</button>



</div>


`;


});



</script>



<script src="script.js"></script>
