<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sell - UniMart</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<nav>

<div class="logo">
🛒 UniMart
</div>


<div class="nav-links">

<a href="index.html">
Home
</a>

</div>

</nav>




<section class="post-section">


<h1>
Sell Your Item 🚀
</h1>


<form id="postForm">


<input 
type="text"
id="itemName"
placeholder="Item name"
required>



<input 
type="number"
id="itemPrice"
placeholder="Price (₦)"
required>




<select id="itemCategory">


<option value="general">
Choose Category
</option>


<option value="phone">
Phones
</option>


<option value="laptop">
Laptops
</option>


<option value="clothes">
Clothes
</option>


<option value="books">
Books
</option>


</select>




<input
type="text"
id="itemImage"
placeholder="Paste image URL (optional)">





<textarea 
id="itemDesc"
placeholder="Describe your item">
</textarea>




<button type="submit">
Post Item
</button>



</form>



</section>




<script type="module" src="script.js"></script>


</body>

</html>
